name: checks
on:
  pull_request:
  push:
    branches: [main, "investigation/**"]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover checks
      - run: python checks/check.py
